name: 60302700_GR

on:
  workflow_dispatch:

  # Schedule times are in UTC. Converted from Qatar time (UTC+3):
  # Sunday 14:00 (Qatar) -> 11:00 UTC
  # Tuesday 10:30 (Qatar) -> 07:30 UTC
  # Thursday 09:00 (Qatar) -> 06:00 UTC

  schedule:
    - cron: "0 11 * * 0"
    - cron: "30 7 * * 2"
    - cron: "0 6 * * 4"

jobs:
  Automated-Booking:
    runs-on: ubuntu-latest

    env:
      TZ_OFFSET: "3"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.x
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Req Installation
        run: pip install -r requirements.txt

      - name: Getting Current Date And Time
        id: get_datetime
        run: python timing.py

      - name: Debug timestamps
        run: |
          echo "Runner UTC: $(date -u)"
          echo "GITHUB_RUN_ID: $GITHUB_RUN_ID"
          echo "GITHUB_RUN_NUMBER: $GITHUB_RUN_NUMBER"
          echo "Hour (env): $Hour"
          echo "Day (env): $Day"

      - name: Date And Time
        run: |
          echo "Current Hour $Hour"
          echo "Current Day $Day"

      - name: Sunday-Gym
        shell: bash
        if: ${{ env.Day == 'Sunday' }}
        run: python gym.py --pa ${{ secrets.PASS_60307390 }} --i ${{ secrets.ID_60307390 }} --ln ${{ secrets.LAST_NAME_60307390 }} --fn ${{ secrets.FIRST_NAME_60307390 }} --ca 0 --t 14 --fd 7

      - name: Tuesday-Gym
        shell: bash
        if: ${{ env.Day == 'Tuesday' }}
        run: python gym.py --pa ${{ secrets.PASS_60307390 }} --i ${{ secrets.ID_60307390 }} --ln ${{ secrets.LAST_NAME_60307390 }} --fn ${{ secrets.FIRST_NAME_60307390 }} --ca 0 --t 10.5 --fd 7

      - name: Thursday-Gym
        shell: bash
        if: ${{ env.Day == 'Thursday' }}
        run: python gym.py --pa ${{ secrets.PASS_60307390 }} --i ${{ secrets.ID_60307390 }} --ln ${{ secrets.LAST_NAME_60307390 }} --fn ${{ secrets.FIRST_NAME_60307390 }} --ca 0 --t 9 --fd 7
