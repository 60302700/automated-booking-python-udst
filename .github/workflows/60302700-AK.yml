name: 60302700_AK_I

on:
  workflow_dispatch:
  # Schedule times are in UTC. Converted from Qatar time (UTC+3):
  # Sunday 12:00 (Qatar) -> 09:00 UTC
  # Tuesday 09:00 (Qatar) -> 06:00 UTC
  # Wednesday 13:30 (Qatar) -> 10:30 UTC
  schedule:
    - cron: "0 9 * * 0"
    - cron: "0 6 * * 2"
    - cron: "30 10 * * 3"

jobs:
  Automated-Booking:
    runs-on: ubuntu-latest
    env:
      TZ_OFFSET: "3"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.x
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Req Installation
        run: pip install -r requirements.txt

      - name: Getting Current Date And Time
        id: get_datetime
        run: python timing.py

      - name: Debug timestamps
        run: |
          echo "Runner UTC: $(date -u)"
          echo "GITHUB_RUN_ID: $GITHUB_RUN_ID"
          echo "GITHUB_RUN_NUMBER: $GITHUB_RUN_NUMBER"
          echo "Hour (env): $Hour"
          echo "Day (env): $Day"

      - name: Date And Time
        run: |
          echo "Current Hour $Hour"
          echo "Current Day $Day"

      - name: Sunday-Gym
        shell: bash
        if: ${{ env.Day == 'Sunday' && env.Hour >= 9 && env.Hour <= 10 }}
        run: python gym.py --pa ${{ secrets.PASS_ME }} --i ${{ secrets.ID_ME }} --ln ${{ secrets.ME_LAST_NAME }} --fn ${{ secrets.ME_FIRST_NAME }} --ca 'Male Fitness Room' --t 12 --fd 7

      - name: Tuesday-Gym
        shell: bash
        if: ${{ env.Day == 'Tuesday' && env.Hour >= 6 && env.Hour <= 7 }}
        run: python gym.py --pa ${{ secrets.PASS_ME }} --i ${{ secrets.ID_ME }} --ln ${{ secrets.ME_LAST_NAME }} --fn ${{ secrets.ME_FIRST_NAME }} --ca 'Male Fitness Room' --t 9 --fd 7

      - name: Wednesday-Gym
        shell: bash
        if: ${{ env.Day == 'Wednesday' && env.Hour >= 10 && env.Hour <= 11 }}
        run: python gym.py --pa ${{ secrets.PASS_ME }} --i ${{ secrets.ID_ME }} --ln ${{ secrets.ME_LAST_NAME }} --fn ${{ secrets.ME_FIRST_NAME }} --ca 'Male Fitness Room' --t 13.5 --fd 7
